[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/awangelo/levy"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Optimizing across the crates as one unit makes the REPL up to a fifth faster,
# and the WebAssembly package the page downloads smaller without making it
# slower, which optimizing for size would. Release builds take twice as long.
[profile.release]
lto = true
codegen-units = 1
